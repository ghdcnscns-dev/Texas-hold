<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Hold'em Pro Expert</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap');

        :root {
            --table-green: #064e3b;
            --gold: #d4af37;
            --dark-glass: rgba(15, 23, 42, 0.85);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #1e3a8a, #0f172a);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--table-green);
            border: 4px solid var(--gold);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 0 50px rgba(0,0,0,0.6), inset 0 0 80px rgba(0,0,0,0.4);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 전광판 */
        .dashboard {
            background: var(--dark-glass);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--gold);
            margin-bottom: 25px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.3);
        }
        .dashboard-title { font-size: 0.75rem; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; margin-bottom: 5px; }
        .win-rate { font-size: 2.2rem; font-weight: 600; color: var(--gold); text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .res-hand-text { margin-top: 8px; font-size: 0.95rem; color: #e2e8f0; font-weight: 600; }

        /* 카드 슬롯 영역 */
        .section-group { margin-bottom: 20px; }
        .area-label { font-size: 0.75rem; letter-spacing: 2px; color: var(--gold); margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }
        .card-row { display: flex; gap: 8px; justify-content: center; }
        
        .card-slot {
            width: 55px; height: 80px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px dashed var(--gold);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.15s ease;
            position: relative;
        }
        .card-slot:active { transform: scale(0.95); }
        .card-slot.empty { color: rgba(212, 175, 55, 0.5); font-size: 1.2rem; }

        /* 채워진 카드 스타일 */
        .card-slot.filled {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .card-slot.filled.hearts, .card-slot.filled.diams { color: #dc2626; }
        .card-slot.filled.spades, .card-slot.filled.clubs { color: #0f172a; }

        /* 리셋 버튼 */
        .reset-btn {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            letter-spacing: 1px;
        }
        .reset-btn:hover { background: rgba(212, 175, 55, 0.2); }

        /* 모달 디자인 (앱 팝업 느낌) */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.8); 
            z-index: 100; 
            justify-content: center; 
            align-items: center; 
            backdrop-filter: blur(5px);
        }
        .modal-content { 
            background: #111827; 
            border: 2px solid var(--gold); 
            border-radius: 20px; 
            padding: 20px; 
            width: 320px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        .modal-title { color: var(--gold); font-size: 1rem; margin-bottom: 15px; letter-spacing: 1px; }
        .suit-group { display: flex; justify-content: space-around; margin-bottom: 15px; }
        .suit-btn { 
            font-size: 1.4rem; background: #1f2937; border: 1px solid #4b5563; 
            width: 50px; height: 50px; border-radius: 10px; cursor: pointer; color: white; 
            display: flex; align-items: center; justify-content: center;
        }
        .suit-btn.active { background: var(--gold); color: #111; border-color: var(--gold); }
        .rank-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .rank-btn { 
            background: #1f2937; border: 1px solid #374151; color: white; 
            padding: 10px 0; border-radius: 8px; font-weight: bold; cursor: pointer; 
            font-size: 1rem; transition: background 0.1s;
        }
        .rank-btn:hover { background: #374151; }
        .close-modal { 
            background: #ef4444; color: white; border: none; width: 100%; 
            padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; 
        }
    </style>
</head>
<body>

<div class="app-container">
    <div>
        <!-- 전광판 -->
        <div class="dashboard">
            <div class="dashboard-title">Winning Probability & Rank</div>
            <div class="win-rate" id="res-winrate">- %</div>
            <div class="res-hand-text" id="res-hand">카드를 선택해주세요</div>
        </div>

        <!-- 공유 카드 영역 -->
        <div class="section-group">
            <div class="area-label">Community Cards (공유패)</div>
            <div class="card-row" id="board-cards">
                <div class="card-slot empty" onclick="openModal('board', 0)">+</div>
                <div class="card-slot empty" onclick="openModal('board', 1)">+</div>
                <div class="card-slot empty" onclick="openModal('board', 2)">+</div>
                <div class="card-slot empty" onclick="openModal('board', 3)">+</div>
                <div class="card-slot empty" onclick="openModal('board', 4)">+</div>
            </div>
        </div>

        <!-- 내 패 영역 -->
        <div class="section-group">
            <div class="area-label">My Hand (내 패)</div>
            <div class="card-row" id="hole-cards">
                <div class="card-slot empty" onclick="openModal('hole', 0)">+</div>
                <div class="card-slot empty" onclick="openModal('hole', 1)">+</div>
            </div>
        </div>
    </div>

    <button class="reset-btn" onclick="resetAll()">전체 초기화 (RESET)</button>
</div>

<!-- 카드 선택 모달 팝업 -->
<div class="modal" id="cardModal">
    <div class="modal-content">
        <div class="modal-title">SELECT CARD</div>
        <div class="suit-group">
            <button class="suit-btn active" onclick="selectSuit('spades')">♠</button>
            <button class="suit-btn" onclick="selectSuit('hearts')" style="color:#ef4444">♥</button>
            <button class="suit-btn" onclick="selectSuit('diams')" style="color:#ef4444">♦</button>
            <button class="suit-btn" onclick="selectSuit('clubs')">♣</button>
        </div>
        <div class="rank-grid" id="rankGrid"></div>
        <button class="close-modal" onclick="closeModal()">취소</button>
    </div>
</div>

<!-- pokersolver 족보 판정 엔진 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pokersolver/2.1.4/pokersolver.min.js"></script>
<script>
    let board = [null, null, null, null, null];
    let hole = [null, null];

    let currentTargetType = null;
    let currentTargetIndex = null;
    let selectedSuit = 'spades';

    const suits = { 'spades': '♠', 'hearts': '♥', 'diams': '♦', 'clubs': '♣' };
    const ranks = ['2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K', 'A'];

    // 모달 내 숫자 버튼 자동 생성
    const rankGrid = document.getElementById('rankGrid');
    ranks.forEach(r => {
        let btn = document.createElement('button');
        btn.className = 'rank-btn';
        btn.innerText = r === 'T' ? '10' : r;
        btn.onclick = () => chooseCard(r);
        rankGrid.appendChild(btn);
    });

    function openModal(type, index) {
        currentTargetType = type;
        currentTargetIndex = index;
        document.getElementById('cardModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('cardModal').style.display = 'none';
    }

    function selectSuit(suit) {
        selectedSuit = suit;
        document.querySelectorAll('.suit-btn').forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    function chooseCard(rank) {
        const cardObj = { suit: selectedSuit, rank: rank };
        
        if (currentTargetType === 'board') {
            board[currentTargetIndex] = cardObj;
        } else {
            hole[currentTargetIndex] = cardObj;
        }

        closeModal();
        renderUI();
        calculatePoker();
    }

    function renderUI() {
        // 보드판 슬롯 렌더링
        const boardSlots = document.getElementById('board-cards').children;
        for (let i = 0; i < 5; i++) {
            if (board[i]) {
                let c = board[i];
                boardSlots[i].className = `card-slot filled ${c.suit}`;
                boardSlots[i].innerHTML = `<span style="font-size:0.9rem">${c.rank === 'T' ? '10' : c.rank}</span><span style="font-size:1.3rem">${suits[c.suit]}</span>`;
            } else {
                boardSlots[i].className = 'card-slot empty';
                boardSlots[i].innerHTML = '+';
            }
        }

        // 홀카드 슬롯 렌더링
        const holeSlots = document.getElementById('hole-cards').children;
        for (let i = 0; i < 2; i++) {
            if (hole[i]) {
                let c = hole[i];
                holeSlots[i].className = `card-slot filled ${c.suit}`;
                holeSlots[i].innerHTML = `<span style="font-size:0.9rem">${c.rank === 'T' ? '10' : c.rank}</span><span style="font-size:1.3rem">${suits[c.suit]}</span>`;
            } else {
                holeSlots[i].className = 'card-slot empty';
                holeSlots[i].innerHTML = '+';
            }
        }
    }

    function resetAll() {
        board = [null, null, null, null, null];
        hole = [null, null];
        renderUI();
        document.getElementById('res-hand').innerText = '카드를 선택해주세요';
        document.getElementById('res-winrate').innerText = '- %';
    }

    function calculatePoker() {
        const activeHole = hole.filter(c => c !== null);
        const activeBoard = board.filter(c => c !== null);
        const totalCards = [...activeHole, ...activeBoard];

        if (activeHole.length === 0) {
            document.getElementById('res-hand').innerText = '내 패를 최소 1장 이상 입력해주세요';
            document.getElementById('res-winrate').innerText = '- %';
            return;
        }

        // 족보 분석
        if (totalCards.length >= 5) {
            let cardStrings = totalCards.map(c => c.rank + c.suit[0]);
            let solved = Hand.solve(cardStrings);
            
            const handNames = {
                'Royal Flush': '로열 플러시 (1위)',
                'Straight Flush': '스트레이트 플러시 (2위)',
                'Four of a Kind': '포카드 (3위)',
                'Full House': '풀하우스 (4위)',
                'Flush': '플러시 (5위)',
                'Straight': '스트레이트 (6위)',
                'Three of a Kind': '트리플 (7위)',
                'Two Pair': '투페어 (8위)',
                'Pair': '원페어 (9위)',
                'High Card': '하이카드 / 탑 (10위)'
            };

            let koreanName = handNames[solved.name] || solved.name;
            document.getElementById('res-hand').innerText = `${koreanName}`;
        } else {
            document.getElementById('res-hand').innerText = `카드 조합 대기중 (${totalCards.length}/5장)`;
        }

        // 초보자 맞춤형 간이 승률 가이드
        let winRateEst = "- %";
        if (activeHole.length === 2 && activeBoard.length === 0) {
            let r1 = activeHole[0].rank, r2 = activeHole[1].rank;
            if (r1 === r2) winRateEst = "HIGH (70%)";
            else if (r1 === 'A' || r2 === 'A' || r1 === 'K' || r2 === 'K') winRateEst = "GOOD (55%)";
            else winRateEst = "NORMAL (40%)";
        } else if (activeBoard.length >= 3) {
            winRateEst = "ACTIVE";
        } else {
            winRateEst = "CALC...";
        }
        document.getElementById('res-winrate').innerText = winRateEst;
    }
</script>
</body>
</html>
